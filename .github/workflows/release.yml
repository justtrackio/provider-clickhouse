name: Release

# Publishes the provider package to GHCR.
#
# Deliberately self-contained rather than delegating to
# crossplane-contrib/provider-workflows (as the template's
# publish-provider-package.yml does): that reusable workflow expects
# XPKG_MIRROR_TOKEN / XPKG_MIRROR_ACCESS_ID secrets which only exist in the
# crossplane-contrib organisation.
#
# Authentication uses the Actions-provided GITHUB_TOKEN, which carries
# packages:write for the repository's owning organisation. That matters here:
# this organisation restricts long-lived fine-grained PATs, so publishing from a
# developer machine is blocked, while publishing from Actions is not.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release (e.g. v0.2.0). Leave empty to publish the current ref without tagging.'
        required: false
        type: string

permissions:
  # contents:write is needed to create the GitHub release for the pushed tag.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      # QEMU and Buildx are required because the package is built for both
      # linux_amd64 and linux_arm64 (see PLATFORMS in the Makefile).
      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        # No `install: true` here: that input was removed in
        # setup-buildx-action v4 and only aliased `docker build` to
        # `docker buildx build`. The image build already invokes
        # `docker buildx build` directly (cluster/images/.../Makefile),
        # so the alias was never needed.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # fetch-depth: 0 is required: the build system derives VERSION from
      # `git describe --tags`, so a shallow clone would produce v0.0.0.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      # Creating the tag inside this run, rather than in the separate Tag
      # workflow, is deliberate. That workflow tags with secrets.GITHUB_TOKEN,
      # and GitHub does not start workflow runs from GITHUB_TOKEN events, so the
      # resulting tag push would never trigger this workflow and the release
      # would silently never be published. Tagging here keeps a dispatched
      # release to a single run with no manual git push.
      - name: Create Tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION_INPUT}" >/dev/null; then
            echo "tag ${VERSION_INPUT} already exists" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${VERSION_INPUT}" -m "${VERSION_INPUT}"
          git push origin "refs/tags/${VERSION_INPUT}"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Report Version
        run: |
          echo "VERSION=$(make -s build.vars | grep '^VERSION=' | cut -d= -f2)" >> "$GITHUB_ENV"
          make -s build.vars | grep -E '^(VERSION|PROJECT_NAME|XPKG_REG_ORGS)='

      - name: Vendor Dependencies
        run: make vendor vendor.check

      # Builds the provider binary, the controller image and the xpkg for every
      # platform in PLATFORMS. --load is needed because buildx does not load
      # images into the daemon by default, and the xpkg build reads them from it.
      - name: Build Artifacts
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the multi-platform package. Invoking the generated per-registry
      # target directly instead of `make publish`, because `publish` also runs
      # output.publish, which uploads to an S3 bucket this project does not use.
      - name: Publish Package
        run: make xpkg.release.publish.ghcr.io/justtrackio.provider-clickhouse

      # Creates the GitHub release for the tag this run published, so a release
      # never has to be published by hand. Skipped for a dispatch without a
      # version, where the ref is a branch and VERSION is a `git describe` value
      # with no matching tag.
      #
      # Uses the preinstalled gh CLI rather than a third-party action: it needs
      # no digest pinning and no additional dependency to keep updated. The run
      # is idempotent so re-running a release does not fail on an existing one.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists, leaving it untouched"
          else
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/justtrackio/provider-clickhouse:${VERSION}"
            echo '```'
            echo
            echo "Install with:"
            echo
            echo '```yaml'
            echo "apiVersion: pkg.crossplane.io/v1"
            echo "kind: Provider"
            echo "metadata:"
            echo "  name: contrib-provider-clickhouse"
            echo "spec:"
            echo "  package: ghcr.io/justtrackio/provider-clickhouse:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
